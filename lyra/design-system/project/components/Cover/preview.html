<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lyra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Public+Sans:wght@400&amp;display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg,#F4F2EB); color:var(--ink,#1F2024); font-family:"Public Sans",system-ui,sans-serif; overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .vega { fill:var(--vega,#3B3E8E); }
  .tint { fill:var(--vega-soft,#E3E3F5); }
  .deep { fill:var(--ink,#1F2024); }
  .warn { fill:var(--warn,#8A5A00); }
  .blk { rx:var(--radius-s,4px); }
  .dot { fill:var(--vega,#3B3E8E); }
  .star { fill:var(--ink,#1F2024); }
  .words { position:absolute; left:var(--space-6,32px); right:var(--space-6,32px); bottom:var(--space-6,32px); max-width:440px; }
  .name { margin:0; font-family:Fraunces,Georgia,serif; font-size:120px; line-height:.9; font-weight:600; letter-spacing:-.02em; color:var(--ink,#1F2024); font-optical-sizing:auto; }
  .tag { margin:var(--space-2,8px) 0 0 6px; font-size:13px; line-height:20px; color:var(--ink-3,#606267); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      vega 176x304 bled off the top at x=16 (the one accent, largest) · vega-soft 272x120 bled off the right edge at the top (the tint) · ink 272x152 bled off the right and bottom edges (the deep) · warn 48x24 once, cut into the slab (it only ever means Estimativa) · about 45% of 960x288
  arrangement one tall slab with two satellites stacked at the right, space-4 gutter between slab and satellites, space-4 between the satellites
  pattern     a dot grid at space-5 pitch in vega over the tint, with five dots of a larger radius placed as the Lyra asterism, from "Source Code Pro com algarismos tabulares" and the five-star mark: precise grid, one constellation
  scales      sides in space-2 multiples; gutters space-4; pitch space-5; corners radius-s; small dots r = radius-xs (2px), star dots r = space-1 (4px)
-->
<rect class="vega blk" x="16" y="-16" width="176" height="304"/>
<rect class="warn blk" x="32" y="240" width="48" height="24"/>
<rect class="tint blk" x="208" y="0" width="272" height="120"/>
<rect class="deep blk" x="208" y="136" width="272" height="168"/>
<g class="dot">
<circle cx="220" cy="12" r="2"/><circle cx="268" cy="12" r="2"/><circle cx="292" cy="12" r="2"/><circle cx="316" cy="12" r="2"/><circle cx="340" cy="12" r="2"/><circle cx="364" cy="12" r="2"/><circle cx="388" cy="12" r="2"/><circle cx="412" cy="12" r="2"/><circle cx="436" cy="12" r="2"/><circle cx="460" cy="12" r="2"/>
<circle cx="220" cy="36" r="2"/><circle cx="244" cy="36" r="2"/><circle cx="292" cy="36" r="2"/><circle cx="316" cy="36" r="2"/><circle cx="364" cy="36" r="2"/><circle cx="388" cy="36" r="2"/><circle cx="412" cy="36" r="2"/><circle cx="436" cy="36" r="2"/><circle cx="460" cy="36" r="2"/>
<circle cx="220" cy="60" r="2"/><circle cx="244" cy="60" r="2"/><circle cx="268" cy="60" r="2"/><circle cx="292" cy="60" r="2"/><circle cx="316" cy="60" r="2"/><circle cx="340" cy="60" r="2"/><circle cx="364" cy="60" r="2"/><circle cx="388" cy="60" r="2"/><circle cx="412" cy="60" r="2"/><circle cx="436" cy="60" r="2"/><circle cx="460" cy="60" r="2"/>
<circle cx="220" cy="84" r="2"/><circle cx="244" cy="84" r="2"/><circle cx="268" cy="84" r="2"/><circle cx="316" cy="84" r="2"/><circle cx="340" cy="84" r="2"/><circle cx="388" cy="84" r="2"/><circle cx="412" cy="84" r="2"/><circle cx="436" cy="84" r="2"/><circle cx="460" cy="84" r="2"/>
<circle cx="220" cy="108" r="2"/><circle cx="244" cy="108" r="2"/><circle cx="268" cy="108" r="2"/><circle cx="292" cy="108" r="2"/><circle cx="316" cy="108" r="2"/><circle cx="340" cy="108" r="2"/><circle cx="364" cy="108" r="2"/><circle cx="388" cy="108" r="2"/><circle cx="412" cy="108" r="2"/><circle cx="436" cy="108" r="2"/><circle cx="460" cy="108" r="2"/>
</g>
<g class="star">
<circle cx="244" cy="12" r="4"/><circle cx="268" cy="36" r="4"/><circle cx="340" cy="36" r="4"/><circle cx="364" cy="84" r="4"/><circle cx="292" cy="84" r="4"/>
</g>
</svg>
</div>
<div class="words">
<h1 class="name">Lyra</h1>
<p class="tag">Leitura afinada do dia para quem opera logística.</p>
</div>
</div>
</body>
</html>
