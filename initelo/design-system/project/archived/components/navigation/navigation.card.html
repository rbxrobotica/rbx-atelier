<!-- @dsCard group="Initelo — Design System" viewport="900x560" name="Navegação" subtitle="Barra superior (desktop e mobile), trilha, abas e lista de aulas com estados" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Navegação</title><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../guidelines/card.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script><script src="../../_ds_bundle.js"></script></head><body><div id="root"></div><script type="text/babel">const {TopNav,Breadcrumb,Tabs,LessonList}=window.IniteloDesignSystem_b8cd96;
const links=[{label:'Cursos',current:true},{label:'Minhas aulas'},{label:'Ajuda'}];const user={name:'Marina Souza',initials:'MS'};
const lessons=[{id:'1',title:'O que entra e o que sai',duration:'8 min',status:'done'},{id:'2',title:'Como organizar o dinheiro do mês',duration:'12 min',status:'current'},{id:'3',title:'Salário no dia 5, contas ao longo do mês',kind:'exercicio',duration:'15 min',status:'available'},{id:'4',title:'Despesas fixas e variáveis',duration:'10 min',status:'locked'}];
function Card(){const [tab,setTab]=React.useState('aula');return <div className="col" style={{gap:20}}>
<div style={{border:'1px solid var(--border-default)',borderRadius:8,overflow:'hidden'}}><TopNav links={links} user={user}/></div>
<div className="g2" style={{gap:32}}>
<div className="col" style={{gap:20}}>
<div><p className="lbl">Mobile (&lt; 768 px)</p><div style={{width:360,border:'1px solid var(--border-default)',borderRadius:8,overflow:'hidden'}}><TopNav compact links={links} user={user}/></div></div>
<div><p className="lbl">Trilha</p><Breadcrumb items={[{label:'Finanças pessoais com IA'},{label:'Módulo 1'},{label:'Aula 1'}]}/></div>
<div><p className="lbl">Abas — selecionada, padrão, foco</p><Tabs label="Seções" value={tab} onChange={setTab} items={[{id:'aula',label:'Aula',icon:'book-open'},{id:'modulo',label:'Módulo',icon:'list'},{id:'tutor',label:'Tutor de IA',icon:'message-circle'}]}/></div>
</div>
<div><p className="lbl">Lista de aulas — concluída, em andamento, disponível, bloqueada</p><div className="tile" style={{padding:8}}><LessonList lessons={lessons}/></div></div>
</div></div>;}
ReactDOM.createRoot(document.getElementById("root")).render(<Card/>);</script></body></html>
