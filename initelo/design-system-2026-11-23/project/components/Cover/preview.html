<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Initelo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&amp;family=Source+Sans+3:ital,wght@0,400..700;1,400..700&amp;display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface-page); color:var(--text-strong); overflow:hidden; padding:0; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .tinta { fill:var(--tinta-700); }
  .funda { fill:var(--tinta-900); }
  .suave { fill:var(--tinta-50); }
  .grifo { fill:var(--grifo-300); }
  .curso { fill:var(--verde-caderneta-600); }
  .pauta { stroke:var(--border-default); stroke-width:1; }
  .r-md { rx:var(--radius-md); }
  .r-sm { rx:var(--radius-sm); }
  .r-xs { rx:var(--radius-xs); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-weight:500; font-size:112px; line-height:.92; letter-spacing:var(--tracking-display); color:var(--text-strong); }
  .tag { margin:var(--space-2) 0 0 4px; font-family:var(--font-text); font-size:14px; line-height:20px; color:var(--text-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      tinta-700 160×280 bled off the top (the brand, largest) · tinta-900 168×208 bleeding off the right · tinta-50 112×144 (the tint) · grifo-300 240×24 laid across them like a highlighter stroke · verde-caderneta-600 40×40 once (course 01) — ≈40% of 960×288
  arrangement one tall Azul-tinta slab with satellites, bottoms on one line space-6 above the edge, space-4 gutters; the grifo band overlaps slab, tint and deep block
  pattern     a few hairline rules, from "Caderno: papel quente, azul-tinta, grifo amarelo, serifa editorial" and the pauta contábil: four border-default rules at a space-12 pitch crossing the blocks, the first one under the grifo band
  scales      sides in space-2 multiples; gutters space-4; rule pitch space-12; corners radius-md (blocks), radius-sm (seal), radius-xs (grifo)
-->
<rect class="tinta r-md" x="24" y="-16" width="160" height="280" rx="8"/>
<rect class="suave r-md" x="200" y="120" width="112" height="144" rx="8"/>
<rect class="funda r-md" x="328" y="56" width="168" height="208" rx="8"/>
<rect class="curso r-sm" x="200" y="56" width="40" height="40" rx="4"/>
<line class="pauta" x1="0" y1="100.5" x2="480" y2="100.5"/>
<line class="pauta" x1="0" y1="148.5" x2="480" y2="148.5"/>
<line class="pauta" x1="0" y1="196.5" x2="480" y2="196.5"/>
<line class="pauta" x1="0" y1="244.5" x2="480" y2="244.5"/>
<rect class="grifo r-xs" x="136" y="88" width="240" height="24" rx="2"/>
</svg>
</div>
<div class="words">
<p class="name">Initelo</p>
<p class="tag">Pergunte melhor. Confira sempre. Decida você.</p>
</div>
</div>
</body>
</html>
