<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Header</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Archivo:wdth,wght@125,700&display=swap">
<style>
body{margin:0;background:var(--bg-0);color:var(--fg-0);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:none;box-shadow:var(--ring-focus)}
.row{max-width:var(--nav-w);margin:0 auto;padding:0 var(--gutter);box-sizing:border-box}
.hdr{background:var(--bg-0);border-bottom:1px solid var(--border)}
.brand-row{height:var(--header-row);display:flex;align-items:center;justify-content:space-between;gap:var(--s-5)}
.lockup{display:flex;align-items:center;gap:var(--s-3)}
.wm{font:700 17px/1 var(--font-wordmark);font-stretch:125%;letter-spacing:-0.02em;color:var(--fg-0)}
.stack{display:flex;flex-direction:column;gap:3px}
.sys{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--fg-2)}
.brand{fill:var(--cyan-brand)}
.util{display:flex;align-items:center;gap:var(--s-5)}
.lang{display:flex;align-items:center;gap:2px;text-transform:uppercase}
.lang a{color:var(--fg-2);padding:var(--s-2) var(--s-2);line-height:1}
.lang a.on{color:var(--fg-0);box-shadow:inset 0 -1px 0 var(--cyan-brand)}
.lang .sep{color:var(--fg-3)}
.cta{background:var(--cta);color:var(--on-cta);text-transform:uppercase;padding:10px var(--s-4);border-radius:var(--radius-sm);line-height:1}
.cta:hover{background:var(--cyan-signal)}
.primary ul{list-style:none;margin:0;padding:0;display:flex;gap:var(--s-6);height:var(--nav-row)}
.primary a{display:flex;align-items:center;height:100%;color:var(--fg-2);box-shadow:inset 0 -1px 0 transparent}
.primary a:hover{color:var(--fg-0)}
.primary a.on{color:var(--fg-0);box-shadow:inset 0 -1px 0 var(--cyan-brand)}
.band{background:var(--bg-1);border-bottom:1px solid var(--border)}
.band ul{list-style:none;margin:0;padding:0;display:flex;height:var(--band-row);align-items:center}
.band li{border-left:1px solid var(--border);height:20px;display:flex;align-items:center}
.band li:first-child{border-left:0}
.band li:first-child a{padding-left:0}
.band a{color:var(--fg-2);padding:0 var(--s-4);line-height:1}
.band a:hover{color:var(--fg-0)}
.band a.on{color:var(--fg-0);padding-bottom:3px;margin-bottom:-3px;box-shadow:inset 0 -1px 0 var(--cyan-brand)}
</style>
</head>
<body>
<header class="hdr">
  <div class="row brand-row">
    <a class="lockup" href="#" aria-label="RBX Systems, início">
      <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><path class="brand" d="M30 8 H56 V34 L34 56 H8 V30 Z"/></svg>
      <span class="stack"><span class="wm">RBX</span><span class="eyebrow sys">Systems</span></span>
    </a>
    <div class="util">
      <div class="lang eyebrow" role="group" aria-label="Idioma">
        <a href="#" class="on" aria-current="true">PT</a><span class="sep" aria-hidden="true">/</span><a href="#">EN</a>
      </div>
      <a class="cta eyebrow" href="#">Contato</a>
    </div>
  </div>
  <nav class="row primary" aria-label="Principal">
    <ul class="nav-primary">
      <li><a href="#">Empresa</a></li>
      <li><a href="#">Soluções</a></li>
      <li><a href="#" class="on" aria-current="true">Produtos</a></li>
      <li><a href="#">Parceria</a></li>
      <li><a href="#">Journal</a></li>
    </ul>
  </nav>
</header>
<div class="band">
  <nav class="row" aria-label="Produtos">
    <ul class="nav-secondary">
      <li><a href="#">Visão geral</a></li>
      <li><a href="#" class="on" aria-current="page">Robson</a></li>
      <li><a href="#">Briefing BTC</a></li>
      <li><a href="#">Strategos</a></li>
      <li><a href="#">Verentir</a></li>
      <li><a href="#">Kulinaryos</a></li>
    </ul>
  </nav>
</div>
</body>
</html>
