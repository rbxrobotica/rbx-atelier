<!-- @dsCard group="Conteúdo" height=470 subtitle="As três frentes de serviço" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>ServiceCard · prévia</title>
<style>
  body { margin: 0; background: var(--base); color: var(--ink); font-family: var(--font-sans); }
  .pv { box-sizing: border-box; padding: var(--space-6); display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: flex-start; }
  .pv-col { box-sizing: border-box; padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-6); max-width: 640px; }
  .pv-grid { box-sizing: border-box; padding: var(--space-6); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--card-min)), 1fr)); gap: var(--space-4); }
  .pv-split { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
  .pv-split > [data-theme] { background: var(--base); color: var(--ink); }
  .pv-cap { margin: 0 0 var(--space-2); font-family: var(--font-mono); font-size: var(--fs-label); line-height: var(--lh-label); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--ink-2); flex-basis: 100%; }
</style>
</head>
<body>
<div id="root" class="pv-grid"></div>
<script>
  var I = window.Informat, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(I.ServiceCard, { index: '01', icon: 'monitor', title: 'Computador pronto para usar', href: '#formatacao',
      description: 'Formatação, reinstalação do sistema, drivers e os programas que você combinar.',
      items: ['Backup combinado antes de apagar qualquer coisa', 'Sistema reinstalado e atualizado', 'Drivers e programas da lista aprovada'] }),
    h(I.ServiceCard, { index: '02', icon: 'wrench', title: 'Manutenção e reparo', href: '#reparo',
      description: 'Diagnóstico de notebooks e computadores de mesa, com orçamento antes do conserto.',
      items: ['Diagnóstico explicado por escrito', 'Peças e mão de obra separadas no orçamento', 'Só executamos o que você aprovar'] }),
    h(I.ServiceCard, { index: '03', icon: 'terminal', title: 'Linux', href: '#linux', tag: 'Hipótese: remoto quando possível',
      description: 'Instalação, migração, configuração e consultoria em Linux.',
      items: ['Instalação e dual boot', 'Migração de arquivos e programas equivalentes', 'Servidores domésticos simples'] })));
</script>
</body>
</html>
