<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Select · prévia</title>
<style>
  body { margin: 0; background: var(--fundo); color: var(--texto); font-family: var(--font-sans); }
  .pv { box-sizing: border-box; padding: var(--space-6); display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: flex-start; }
  .pv-col { box-sizing: border-box; padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); }
  .pv-split { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
  .pv-stack { display: flex; flex-direction: column; }
  .pv-split > [data-theme], .pv-stack > [data-theme] { background: var(--fundo); color: var(--texto); min-width: 0; }
  .pv-cap { margin: 0; flex-basis: 100%; font-size: var(--fs-label); line-height: var(--lh-label); font-weight: var(--fw-semibold); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--texto-2); }
  .pv-icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: var(--space-2); }
  .pv-icon { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); padding: var(--space-2); border-radius: var(--radius-s); font-family: var(--font-mono); font-size: 11px; line-height: 14px; color: var(--texto-2); text-align: center; overflow-wrap: anywhere; }
  .pv-box { box-sizing: border-box; min-height: var(--control-l); padding: var(--space-3); border-radius: var(--radius-m); background: var(--marca-suave); color: var(--marca-forte); font-size: var(--fs-small); font-weight: var(--fw-semibold); display: grid; place-content: center; }
</style>
</head>
<body>
<div class="pv-split"><div data-theme="claro" id="t-claro"></div><div data-theme="escuro" id="t-escuro"></div></div>
<script>
  var I = window.Iteruno;
  function el(root, cls, html) { var d = document.createElement('div'); if (cls) d.className = cls; if (html) d.innerHTML = html; root.appendChild(d); return d; }
  function cap(root, t) { var p = document.createElement('p'); p.className = 'pv-cap'; p.textContent = t; root.appendChild(p); return p; }
  function m(C, target, props) { return I.mount(C, { target: target, props: props || {} }); }
  function demo(root, tema) {

    var r = el(root, 'pv-col');
    m(I.Select, r, { label: 'Assunto', name: 'assunto', placeholder: 'Escolha um assunto', options: [{ value: 'suporte', label: 'Suporte e manutenção' }, { value: 'site', label: 'Site' }, { value: 'curso', label: 'Cursos' }, { value: 'outro', label: 'Outro assunto' }] });
    m(I.Select, r, { label: 'Como prefere ser atendido', name: 'canal', value: 'whatsapp', hint: 'Respondemos em até um dia útil.', options: [{ value: 'whatsapp', label: 'WhatsApp' }, { value: 'email', label: 'E-mail' }, { value: 'tel', label: 'Ligação' }] });
    m(I.Select, r, { label: 'Turma', name: 'turma', placeholder: 'Escolha a turma', error: 'Escolha uma turma para reservar a vaga.', options: [{ value: 'a', label: 'Manhã' }, { value: 'b', label: 'Noite', disabled: true }] });
  }
  demo(document.getElementById('t-claro'), 'claro');
  demo(document.getElementById('t-escuro'), 'escuro');
</script>
</body>
</html>
