<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>GPH</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--wall); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 560px; height: 288px; }
  .klein { fill: var(--klein); }
  .deep { fill: var(--ink); }
  .ouro { fill: var(--ouro); }
  .tag { fill: var(--line); }
  .work { rx: var(--radius-none); }
  .lbl { rx: var(--radius-s); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-size: 120px; line-height: .92; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
  .tagline { margin: var(--space-2) 0 0 6px; font-size: 14px; line-height: 20px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 560 288" width="560" height="288">
<!--
  blocks      klein 168x208 (the main work, largest) · ink 104x136 · ouro 64x80 (the dot's colour as a small work) · klein 96x160 bleeding off the right edge; about 30% of 960x288
  arrangement a salon hang: every work centred on one line (y 132), unequal sizes, gutters of space-5, the last one bleeding off the right edge
  pattern     a literal motif, the wall label (the README's "etiqueta"): one line-coloured label under each work, space-3 below it, radius-s corners; nothing else
  scales      sides in space-2 multiples; gutters space-5 (24); label offset space-3 (12), label height space-2 (8); works radius-none, labels radius-s
-->
<rect class="klein work" x="24" y="28" width="168" height="208" rx="0"/>
<rect class="tag lbl" x="24" y="248" width="40" height="8" rx="3"/>
<rect class="deep work" x="216" y="64" width="104" height="136" rx="0"/>
<rect class="tag lbl" x="216" y="212" width="32" height="8" rx="3"/>
<rect class="ouro work" x="344" y="92" width="64" height="80" rx="0"/>
<rect class="tag lbl" x="344" y="184" width="24" height="8" rx="3"/>
<rect class="klein work" x="432" y="52" width="96" height="160" rx="0"/>
<rect class="tag lbl" x="432" y="224" width="32" height="8" rx="3"/>
</svg>
</div>
<div class="words">
<h1 class="name">GPH</h1>
<p class="tagline">Galeria Premium Hoje · classificados apresentados como uma galeria.</p>
</div>
</div>
</body>
</html>
