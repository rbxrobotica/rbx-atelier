<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PlanLock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Public+Sans:wght@400;500;600;700&amp;family=Source+Code+Pro:wght@400;500;600&amp;display=swap">
<style>

:root{
--ly-bg:var(--bg,#F4F2EB);--ly-surface:var(--surface,#FBFAF6);--ly-sunken:var(--sunken,#EAE7DE);--ly-raised:var(--raised,#E1DDD1);
--ly-ink:var(--ink,#1F2024);--ly-ink-2:var(--ink-2,#4A4B51);--ly-ink-3:var(--ink-3,#606267);--ly-line:var(--line,#D8D4C8);--ly-line-strong:var(--line-strong,#B5B0A2);--ly-field:var(--field,#84827A);
--ly-vega:var(--vega,#3B3E8E);--ly-vega-strong:var(--vega-strong,#2B2D6E);--ly-vega-soft:var(--vega-soft,#E3E3F5);--ly-on-vega:var(--on-vega,#FFFFFF);
--ly-ok:var(--ok,#2E6B44);--ly-ok-soft:var(--ok-soft,#E3F0E6);--ly-warn:var(--warn,#8A5A00);--ly-warn-soft:var(--warn-soft,#FAF0D9);--ly-err:var(--err,#A12A34);--ly-err-soft:var(--err-soft,#FBEBEC);
--ly-font-display:Fraunces,Georgia,serif;--ly-font-sans:'Public Sans',system-ui,sans-serif;--ly-font-mono:'Source Code Pro',ui-monospace,monospace;
--ly-text-title-1-size:26px;--ly-text-title-1-line:1.2;--ly-text-title-1-weight:500;--ly-text-title-2-size:19px;--ly-text-title-2-line:1.3;--ly-text-title-2-weight:500;
--ly-text-body-size:15px;--ly-text-body-line:1.55;--ly-text-body-s-size:13.5px;--ly-text-body-s-line:1.5;--ly-text-label-size:11.5px;--ly-text-label-line:1.3;--ly-text-label-weight:600;--ly-label-tracking:0.08em;
--ly-text-data-size:13px;--ly-text-data-line:1.5;--ly-text-data-s-size:11.5px;--ly-text-data-s-line:1.4;--ly-text-number-size:22px;--ly-text-number-line:1.2;--ly-text-number-weight:500;
--ly-radius-xs:2px;--ly-radius-s:4px;--ly-radius-m:8px;--ly-radius-pill:999px;--ly-dur:160ms;--ly-ease:cubic-bezier(0.2,0,0,1);
--ly-focus-ring:2px solid var(--ly-vega);--ly-focus-offset:2px;--ly-sidebar:272px;--ly-panel:320px;--ly-flow-max:720px;--ly-row:32px}

html,body{margin:0;background:var(--ly-bg)}
body{padding:12px}

.ly{font-family:var(--ly-font-sans);font-size:var(--ly-text-body-size);line-height:var(--ly-text-body-line);color:var(--ly-ink);background:var(--ly-bg);-webkit-font-smoothing:antialiased}
.ly *,.ly *::before,.ly *::after{box-sizing:border-box}
.ly a{color:var(--ly-vega);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.ly a:hover{color:var(--ly-vega-strong)}
.ly :focus-visible{outline:var(--ly-focus-ring);outline-offset:var(--ly-focus-offset);border-radius:var(--ly-radius-xs)}
.ly-label{font-family:var(--ly-font-sans);font-size:var(--ly-text-label-size);line-height:var(--ly-text-label-line);font-weight:var(--ly-text-label-weight);text-transform:uppercase;letter-spacing:var(--ly-label-tracking);color:var(--ly-ink-3)}
.ly-data{font-family:var(--ly-font-mono);font-size:var(--ly-text-data-size);line-height:var(--ly-text-data-line);font-variant-numeric:tabular-nums}
.ly-data-s{font-family:var(--ly-font-mono);font-size:var(--ly-text-data-s-size);line-height:var(--ly-text-data-s-line);font-variant-numeric:tabular-nums}
.ly-number{font-family:var(--ly-font-mono);font-size:var(--ly-text-number-size);line-height:var(--ly-text-number-line);font-weight:var(--ly-text-number-weight);font-variant-numeric:tabular-nums;color:var(--ly-ink)}
.ly-title-1{margin:0;font-family:var(--ly-font-display);font-size:var(--ly-text-title-1-size);line-height:var(--ly-text-title-1-line);font-weight:var(--ly-text-title-1-weight);color:var(--ly-ink)}
.ly-title-2{margin:0;font-family:var(--ly-font-display);font-size:var(--ly-text-title-2-size);line-height:var(--ly-text-title-2-line);font-weight:var(--ly-text-title-2-weight);color:var(--ly-ink)}
.ly-body-s{font-size:var(--ly-text-body-s-size);line-height:var(--ly-text-body-s-line)}
.ly-muted{color:var(--ly-ink-2)}
.ly-meta{color:var(--ly-ink-3)}
.ly-ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ly-ico--s{width:14px;height:14px}

/* Shell da web seca */
.ly-app{display:grid;grid-template-columns:var(--ly-sidebar) minmax(0,1fr);height:100%;min-height:0;background:var(--ly-bg);color:var(--ly-ink);overflow:hidden}
.ly-app--panel{grid-template-columns:var(--ly-sidebar) minmax(0,1fr) var(--ly-panel)}
.ly-side{background:var(--ly-sunken);border-right:1px solid var(--ly-line);display:flex;flex-direction:column;min-width:0;min-height:0}
.ly-brandbar{height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--ly-line);flex:none}
.ly-brandbar svg{width:24px;height:24px;flex:none}
.ly-wordmark{font-family:var(--ly-font-display);font-size:20px;line-height:1;font-weight:600;letter-spacing:-0.01em;color:var(--ly-ink)}
.ly-by{font-family:var(--ly-font-sans);font-size:9.5px;line-height:1;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ly-ink-3);margin-top:4px}
.ly-side-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px}
.ly-list{list-style:none;margin:0;padding:0 0 8px;overflow:auto;flex:1 1 auto}
.ly-item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:6px 14px 6px 16px;min-height:var(--ly-row);border-left:2px solid transparent;cursor:pointer}
.ly-item:hover{background:var(--ly-raised)}
.ly-item--on{background:var(--ly-vega-soft);border-left-color:var(--ly-vega)}
.ly-item-date{font-family:var(--ly-font-mono);font-size:var(--ly-text-data-s-size);color:var(--ly-ink-3);font-variant-numeric:tabular-nums}
.ly-item-title{font-size:var(--ly-text-body-s-size);line-height:1.4;color:var(--ly-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ly-item--unread .ly-item-title{font-weight:600}
.ly-item--unread .ly-item-date{color:var(--ly-vega);font-weight:600}
.ly-side-foot{border-top:1px solid var(--ly-line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--ly-ink-2);flex:none}

/* Barra de estado da conexao */
.ly-status{min-height:40px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--ly-line);background:var(--ly-surface);font-size:var(--ly-text-body-s-size);color:var(--ly-ink-2);flex:none}
.ly-status b{font-weight:600;color:var(--ly-ink)}
.ly-status .ly-spacer{flex:1 1 auto}
.ly-dot{width:8px;height:8px;border-radius:var(--ly-radius-pill);flex:none}
.ly-status--ok .ly-dot{background:var(--ly-ok)}
.ly-status--neutral .ly-dot{background:transparent;border:1.5px solid var(--ly-ink-3)}
.ly-status--warn{background:var(--ly-warn-soft)}
.ly-status--warn .ly-dot{background:var(--ly-warn)}
.ly-status--err{background:var(--ly-err-soft)}
.ly-status--err .ly-dot{background:var(--ly-err)}
.ly-progress{height:3px;width:120px;background:var(--ly-line);border-radius:var(--ly-radius-xs);overflow:hidden;flex:none}
.ly-progress i{display:block;height:100%;background:var(--ly-warn)}

/* Coluna principal e fluxo cronologico */
.ly-main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--ly-bg)}
.ly-flow{flex:1 1 auto;overflow:auto;padding:16px 24px 24px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:calc(var(--ly-flow-max) + 48px)}
.ly-day{display:flex;align-items:center;gap:12px;font-family:var(--ly-font-sans);font-size:var(--ly-text-label-size);font-weight:600;letter-spacing:var(--ly-label-tracking);text-transform:uppercase;color:var(--ly-ink-3);margin-top:4px}
.ly-day::after{content:"";flex:1 1 auto;border-top:1px solid var(--ly-line)}
.ly-line{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start}
.ly-stamp{font-family:var(--ly-font-mono);font-size:var(--ly-text-data-s-size);line-height:20px;color:var(--ly-ink-3);font-variant-numeric:tabular-nums;padding-top:1px}
.ly-sys{font-size:var(--ly-text-body-s-size);line-height:20px;color:var(--ly-ink-2)}
.ly-sys .ly-data{color:var(--ly-ink)}
.ly-edhead{display:flex;align-items:center;gap:12px;padding:10px 24px;border-bottom:1px solid var(--ly-line);background:var(--ly-bg);flex:none;flex-wrap:wrap}
.ly-edhead .ly-spacer{flex:1 1 auto}

/* Cartao de envelope */
.ly-env{background:var(--ly-surface);border:1px solid var(--ly-line);border-radius:var(--ly-radius-s);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ly-env--on{border-color:var(--ly-vega)}
.ly-env--err{border-color:var(--ly-err)}
.ly-env--locked .ly-env-title{color:var(--ly-ink-2)}
.ly-env-head{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-family:var(--ly-font-mono);font-size:var(--ly-text-data-s-size);color:var(--ly-ink-3);font-variant-numeric:tabular-nums}
.ly-env-head .ly-id{color:var(--ly-ink);font-weight:500}
.ly-env-title{margin:0;font-family:var(--ly-font-display);font-size:var(--ly-text-title-2-size);line-height:var(--ly-text-title-2-line);font-weight:var(--ly-text-title-2-weight);color:var(--ly-ink)}
.ly-env-foot{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--ly-ink-2)}
.ly-env-foot .ly-spacer{flex:1 1 auto}

/* Selos */
.ly-badge{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:var(--ly-radius-xs);font-family:var(--ly-font-sans);font-size:10.5px;line-height:1;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.ly-badge--pro{background:var(--ly-vega-soft);color:var(--ly-vega)}
.ly-badge--livre{background:var(--ly-sunken);color:var(--ly-ink-2);border:1px solid var(--ly-line-strong)}
.ly-badge--ok{background:var(--ly-ok-soft);color:var(--ly-ok)}
.ly-badge--warn{background:var(--ly-warn-soft);color:var(--ly-warn)}
.ly-badge--err{background:var(--ly-err-soft);color:var(--ly-err)}
.ly-badge--type{background:transparent;color:var(--ly-ink-3);border:1px solid var(--ly-line-strong)}
.ly-badge--src{font-family:var(--ly-font-mono);text-transform:none;letter-spacing:0;font-weight:500;font-size:11px;background:var(--ly-sunken);color:var(--ly-ink-2);border:1px solid var(--ly-line)}
.ly-badge .ly-ico{width:11px;height:11px;stroke-width:2.2}

/* Leitura em tres blocos */
.ly-read{display:flex;flex-direction:column;gap:16px;min-width:0}
.ly-block{border-top:1px solid var(--ly-line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ly-block-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ly-block-n{font-family:var(--ly-font-mono);font-size:var(--ly-text-data-s-size);color:var(--ly-ink-3)}
.ly-block ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.5;color:var(--ly-ink-2)}
.ly-block ol li b{color:var(--ly-ink);font-weight:600}
.ly-block ol li .ly-data{color:var(--ly-ink)}
.ly-block ol li .ly-badge{vertical-align:1px;margin-left:4px}

/* Tabela de impacto */
.ly-table{width:100%;border-collapse:collapse;font-size:var(--ly-text-body-s-size);line-height:1.4}
.ly-table th{text-align:left;font-family:var(--ly-font-sans);font-size:var(--ly-text-label-size);font-weight:600;letter-spacing:var(--ly-label-tracking);text-transform:uppercase;color:var(--ly-ink-3);padding:6px 8px;background:var(--ly-sunken);border-bottom:1px solid var(--ly-line)}
.ly-table td{padding:7px 8px;border-bottom:1px solid var(--ly-line);vertical-align:top;color:var(--ly-ink-2)}
.ly-table td:first-child{color:var(--ly-ink)}
.ly-table .num{text-align:right;font-family:var(--ly-font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ly-ink)}
.ly-table tr.total td{font-weight:600;color:var(--ly-ink);border-bottom:2px solid var(--ly-line-strong)}
.ly-table .sub{display:block;font-size:12px;color:var(--ly-ink-3);font-weight:400}

/* Avisos */
.ly-notice{display:flex;gap:10px;padding:10px 12px;border-radius:var(--ly-radius-s);font-size:13px;line-height:1.5;border:1px solid;color:var(--ly-ink);align-items:flex-start}
.ly-notice .ly-ico{margin-top:2px}
.ly-notice--warn{background:var(--ly-warn-soft);border-color:var(--ly-warn)}
.ly-notice--warn .ly-ico{color:var(--ly-warn)}
.ly-notice--err{background:var(--ly-err-soft);border-color:var(--ly-err)}
.ly-notice--err .ly-ico{color:var(--ly-err)}
.ly-notice--info{background:var(--ly-vega-soft);border-color:var(--ly-vega)}
.ly-notice--info .ly-ico{color:var(--ly-vega)}
.ly-notice--ok{background:var(--ly-ok-soft);border-color:var(--ly-ok)}
.ly-notice--ok .ly-ico{color:var(--ly-ok)}
.ly-notice b{font-weight:600}
.ly-notice .ly-actions{margin-top:6px}

/* Painel de premissas */
.ly-panel{background:var(--ly-surface);border-left:1px solid var(--ly-line);display:flex;flex-direction:column;min-width:0;min-height:0}
.ly-panel-head{min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;border-bottom:1px solid var(--ly-line);flex:none}
.ly-panel-body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:16px;font-size:var(--ly-text-body-s-size)}
.ly-kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;margin:0;font-size:13px;line-height:1.4}
.ly-kv dt{color:var(--ly-ink-2)}
.ly-kv dd{margin:0;font-family:var(--ly-font-mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--ly-ink);white-space:nowrap}
.ly-srcs{display:flex;flex-wrap:wrap;gap:6px}

/* Botoes */
.ly-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--ly-radius-xs);border:1px solid transparent;font-family:var(--ly-font-sans);font-size:var(--ly-text-body-s-size);font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;transition:background var(--ly-dur) var(--ly-ease),color var(--ly-dur) var(--ly-ease),border-color var(--ly-dur) var(--ly-ease)}
.ly-btn--primary{background:var(--ly-vega);color:var(--ly-on-vega)}
.ly-btn--primary:hover{background:var(--ly-vega-strong)}
.ly-btn--secondary{background:transparent;color:var(--ly-ink);border-color:var(--ly-field)}
.ly-btn--secondary:hover{background:var(--ly-raised)}
.ly-btn--quiet{background:transparent;color:var(--ly-vega);padding:0 6px}
.ly-btn--quiet:hover{text-decoration:underline;text-underline-offset:2px}
.ly-btn[disabled],.ly-btn--disabled{background:var(--ly-sunken);color:var(--ly-ink-3);border-color:var(--ly-line);cursor:not-allowed}
.ly-btn--s{height:26px;font-size:12.5px;padding:0 8px}
.ly-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Campos */
.ly-form{display:flex;flex-direction:column;gap:20px;max-width:560px}
.ly-fs{display:flex;flex-direction:column;gap:6px;min-width:0}
.ly-fs>label,.ly-fs-title{font-size:13px;line-height:1.3;font-weight:500;color:var(--ly-ink)}
.ly-input,.ly-select{height:32px;padding:0 10px;border:1px solid var(--ly-field);border-radius:var(--ly-radius-xs);background:var(--ly-surface);color:var(--ly-ink);font-family:var(--ly-font-sans);font-size:14px;line-height:1;width:100%;min-width:0}
.ly-input--data{font-family:var(--ly-font-mono);font-variant-numeric:tabular-nums}
.ly-input::placeholder{color:var(--ly-ink-3)}
.ly-input--err{border-color:var(--ly-err)}
.ly-help{font-size:12.5px;line-height:1.4;color:var(--ly-ink-3)}
.ly-help--err{color:var(--ly-err)}
.ly-grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.ly-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.ly-group{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--ly-line);border-radius:var(--ly-radius-s);background:var(--ly-surface)}
.ly-group-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ly-switch{display:inline-flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ly-ink);cursor:pointer}
.ly-switch input{appearance:none;-webkit-appearance:none;width:32px;height:18px;border-radius:var(--ly-radius-pill);background:var(--ly-field);position:relative;margin:0;cursor:pointer;flex:none}
.ly-switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:var(--ly-radius-pill);background:var(--ly-surface)}
.ly-switch input:checked{background:var(--ly-vega)}
.ly-switch input:checked::after{left:16px;background:var(--ly-on-vega)}
.ly-radio{display:flex;flex-wrap:wrap;gap:0}
.ly-radio label{display:inline-flex;align-items:center;height:30px;padding:0 12px;border:1px solid var(--ly-field);margin-left:-1px;font-size:13px;color:var(--ly-ink);cursor:pointer;background:var(--ly-surface)}
.ly-radio label:first-child{margin-left:0;border-radius:var(--ly-radius-xs) 0 0 var(--ly-radius-xs)}
.ly-radio label:last-child{border-radius:0 var(--ly-radius-xs) var(--ly-radius-xs) 0}
.ly-radio input{position:absolute;opacity:0;width:0;height:0}
.ly-radio input:checked+span{color:var(--ly-vega);font-weight:600}
.ly-radio label.on{background:var(--ly-vega-soft);border-color:var(--ly-vega);color:var(--ly-vega);font-weight:600;position:relative;z-index:1}

/* Bloqueio por plano */
.ly-lock{border:1px dashed var(--ly-line-strong);border-radius:var(--ly-radius-s);padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--ly-sunken);color:var(--ly-ink-2);font-size:var(--ly-text-body-s-size)}
.ly-lock-title{display:flex;align-items:center;gap:8px;color:var(--ly-ink);font-weight:600;font-size:14px}
.ly-lock .ly-ico{color:var(--ly-ink-3)}

/* Placeholder de recuperacao */
.ly-skel{height:10px;border-radius:var(--ly-radius-xs);background:var(--ly-raised)}

</style>
</head>
<body class="ly">
<div style="max-width:640px"><div class="ly-lock"><div class="ly-lock-title"><svg class="ly-ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="7" width="9" height="7" rx="1"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>Edição diária disponível no Pro</div><p style="margin:0">Seu plano Livre inclui a leitura semanal geral, sem o bloco de impacto por perfil.</p><div class="ly-actions"><button class="ly-btn ly-btn--primary" type="button">Conhecer o Pro</button><a class="ly-btn ly-btn--quiet" href="#semanal">Abrir a leitura semanal</a></div></div></div>
</body>
</html>
