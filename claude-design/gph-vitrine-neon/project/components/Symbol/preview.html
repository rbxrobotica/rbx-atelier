<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Symbol</title></head>
<body>
<div id="root"></div>
<script>
  var G = window.GphNeon, h = React.createElement;
  ReactDOM.createRoot(document.getElementById("root")).render(
    h('div', { className: 'gn-row', style: { gap: '48px', alignItems: 'flex-end' } },
      h(G.Symbol, { size: 142, title: 'GPH' }),
      h(G.Symbol, { size: 64 }),
      h(G.Symbol, { size: 40 }),
      h(G.Symbol, { size: 24 }),
      h(G.Symbol, { size: 16 })));
</script>
</body>
</html>
