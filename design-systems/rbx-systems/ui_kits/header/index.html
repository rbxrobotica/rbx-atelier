<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RBX Systems: header and breadcrumb</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0B; min-height: 100vh; }
  body { font-family: var(--rbx-font-sans); color: #F5F5F3; }
  *, *::before, *::after { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body class="rbx">
<div id="root"></div>

<script type="text/babel" src="../_shared/RbxPrimitives.jsx"></script>
<script type="text/babel" src="../_shared/ChromeComponents.jsx"></script>

<script type="text/babel">
// The states the header and the breadcrumb resolve together. `leaf` is the title of a
// page known only by its parent; the second leaf keeps the site name on purpose, to show
// that the crumb drops it.
const STATES = [
  { label: 'Home', active: 'home' },
  { label: 'Section landing', active: 'about' },
  { label: 'Page of a section', active: 'atelier' },
  { label: 'Detail under a page', active: 'team', leaf: 'Leandro Damasio' },
  { label: 'Detail under a landing', active: 'services', leaf: 'LLMOps — RBX Systems' },
  { label: 'Long title', active: 'blog', leaf: 'A week with the book open: what reviewing Robson taught us' },
  { label: 'Standalone page', active: 'contact' },
];

const App = () => {
  const [state, setState] = React.useState(STATES[2]);
  const nav = (id) => setState({ active: id });
  return (
    <>
      <TopNav active={state.active} leaf={state.leaf} onNav={nav} />
      <Container>
        <Breadcrumb active={state.active} leaf={state.leaf} onNav={nav} />
        <section style={{ padding: '48px 0 96px', maxWidth: '42rem' }}>
          <Eyebrow style={{ marginBottom: 16 }}>Header and breadcrumb</Eyebrow>
          <p style={{ margin: 0, fontSize: 15, lineHeight: 1.55, color: 'var(--rbx-fg-muted)' }}>
            Three rows, opaque, not sticky. Use the header itself, or pick a state below. Narrow the
            window under 768px for the mobile layout.
          </p>
          <div style={{ marginTop: 24, display: 'flex', flexWrap: 'wrap', gap: 8 }}>
            {STATES.map(s => (
              <Button key={s.label} variant="outline" size="sm" onClick={() => setState(s)}
                aria-pressed={state === s}>{s.label}</Button>
            ))}
          </div>
        </section>
      </Container>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
