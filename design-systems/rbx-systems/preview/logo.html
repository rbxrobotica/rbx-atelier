<!doctype html><html><head><meta charset="utf-8"><title>RBX Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--rbx-ink);color:var(--rbx-fg);font-family:var(--rbx-font-sans);}
  .card{box-sizing:border-box;width:700px;padding:28px 32px;background:var(--rbx-ink);color:var(--rbx-fg);}
  .row{display:flex;align-items:baseline;gap:16px;}
  .swatch-row{display:flex;gap:0;}
  .swatch{flex:1;height:56px;position:relative;}
  .swatch-label{font-family:var(--rbx-font-mono);font-size:10px;letter-spacing:0.04em;color:var(--rbx-fg-dim);margin-top:8px;display:flex;justify-content:space-between;}
  .hair{border-top:1px solid var(--rbx-line);}
  .mono{font-family:var(--rbx-font-mono);}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:0.14em;color:var(--rbx-fg-dim);font-weight:500;}
  .dim{color:var(--rbx-fg-dim);}
  .muted{color:var(--rbx-fg-muted);}
</style></head><body><div class="card rbx">
    <div style="display:flex;align-items:center;gap:24px">
      <img src="../assets/merovelis-mark.svg" alt="RBX mark" style="width:56px;height:56px">
      <div style="display:flex;flex-direction:column;align-items:flex-start;gap:6px">
        <div style="font-family:var(--rbx-font-wordmark);font-size:34px;font-weight:700;font-stretch:125%;line-height:1;letter-spacing:-0.02em;color:var(--rbx-fg)">RBX</div>
        <div class="mono" style="font-size:18px;line-height:1;font-weight:500;text-transform:uppercase;letter-spacing:0.2em;color:var(--rbx-fg-dim)">Systems</div>
      </div>
      <div style="margin-left:auto;display:flex;flex-direction:column;gap:4px">
        <div class="mono" style="font-size:10px;color:var(--rbx-fg-dim)">clear-space ≥ 0.5× mark height</div>
        <div class="mono" style="font-size:10px;color:var(--rbx-fg-dim)">min-size 12px</div>
        <div class="mono" style="font-size:10px;color:var(--rbx-fg-dim)">favicon = the mark, never a letter</div>
        <div class="mono" style="font-size:10px;color:var(--rbx-fg-dim)">header 28 / 17 / 9, gap 12 · shown at 2×</div>
      </div>
    </div></div></body></html>
