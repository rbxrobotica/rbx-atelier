<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300&family=JetBrains+Mono:wght@500&display=swap">
<style>
  body { margin:0; padding:24px; background:var(--bg-0); font-family:var(--font-sans); color:var(--fg-0); display:flex; align-items:center; gap:48px; }
  .inv { background:#F2EFE6; padding:12px 20px; border-radius:2px; display:flex; align-items:center; }
  /* Archivo is for the wordmark only. Pinned to v25, as in brand-voltage/colors_and_type.css. */
  @font-face {
    font-family: 'Archivo';
    font-style: normal;
    font-weight: 700;
    font-stretch: 125%;
    font-display: swap;
    src: url(https://fonts.gstatic.com/s/archivo/v25/k3k6o8UDI-1M0wlSV9XAw6lQkqWY8Q8EsJaRE-NWIDdgffTT0zRZ9xdp.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  .lockup { display: inline-flex; align-items: center; gap: 12px; white-space: nowrap; }
  .lockup svg { display: block; flex: none; }
  .lockup .stack { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
  .lockup .wm { font-family: 'Archivo', 'Inter', system-ui, sans-serif; font-weight: 700; font-stretch: 125%; font-size: 17px; line-height: 1; letter-spacing: -0.02em; }
  .lockup .sys { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 9px; line-height: 1; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; }
  .lockup .sys-h { font-family: 'Inter', system-ui, sans-serif; font-weight: 300; font-size: 17px; line-height: 1; letter-spacing: -0.01em; }
</style></head>
<body>
  <!-- The house mark and lockup, set in type as brand-voltage/BRAND-MARK.md describes. -->
  <div><svg viewBox="0 0 64 64" width="28" height="28" role="img" aria-label="Merovelis"><path fill="#22E5E5" d="M30 8 H56 V34 L34 56 H8 V30 Z"/></svg></div>
  <div><span class="lockup"><svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><path fill="#22E5E5" d="M30 8 H56 V34 L34 56 H8 V30 Z"/></svg><span class="stack"><span class="wm" style="color:#ECECEC">Merovelis</span><span class="sys" style="color:#7A7F87">Systems</span></span></span></div>
  <div><span class="lockup"><svg viewBox="0 0 64 64" width="24" height="24" aria-hidden="true"><path fill="#22E5E5" d="M30 8 H56 V34 L34 56 H8 V30 Z"/></svg><span class="wm" style="color:#ECECEC">Merovelis</span><span class="sys-h" style="color:#B8BCC2">Systems</span></span></div>
  <div class="inv"><span class="lockup"><svg viewBox="0 0 64 64" width="24" height="24" aria-hidden="true"><path fill="#0F8F8F" d="M30 8 H56 V34 L34 56 H8 V30 Z"/></svg><span class="wm" style="color:#20201C">Merovelis</span><span class="sys-h" style="color:#666056">Systems</span></span></div>
</body></html>
