<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Informat · Logotipos e símbolo</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/informat/tokens.css">
<link rel="stylesheet" href="ds/informat/components/bundle.css">
<script src="ds/informat/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&family=Atkinson+Hyperlegible+Mono:wght@400;500;600&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 48px 56px; display: flex; flex-direction: column; gap: 28px; background: var(--base); color: var(--ink); font-family: var(--font-sans);">
<header style="display: flex; justify-content: space-between; align-items: flex-end; gap: 32px;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<p class="inf-label" style="margin: 0; color: var(--cobre-ink);">Marca · logotipo, símbolo e variações</p>
<h1 style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.01em;">O pingo do i é uma via de placa</h1>
</div>
<p style="margin: 0; max-width: 520px; font-size: 14px; line-height: 20px; color: var(--ink-2);">Contornos da Atkinson Hyperlegible Next ExtraBold, tracking de -22 unidades. A via tem raio 104 e furo 48 em unidades da fonte. Símbolo em grade de 48 com raio 12.</p>
</header>

<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 1.35fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 16px;">

<figure style="margin: 0; grid-row: span 1; position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;">
<figcaption class="inf-label">Assinatura horizontal e área de proteção</figcaption>
<div style="align-self: center; position: relative; padding: 17px; outline: 1px dashed var(--cobre); outline-offset: 0;">
<img src="/_blob/a82fa723e25252ff2c4924dc43513bcd" alt="Informat, assinatura horizontal" style="display: block; height: 64px; width: auto;">
<span style="position: absolute; top: 0; left: -28px; height: 17px; display: flex; align-items: center; font-family: var(--font-mono); font-size: 12px; color: var(--cobre-ink);">x</span>
<span style="position: absolute; bottom: -22px; left: 0; width: 17px; text-align: center; font-family: var(--font-mono); font-size: 12px; color: var(--cobre-ink);">x</span>
</div>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-2);">x = altura do anel da via (26% da altura do logotipo). Deixe x livre em volta.</p>
</figure>

<figure data-theme="dark" style="margin: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; background: var(--base); color: var(--ink); border-radius: 12px;">
<figcaption class="inf-label">Fundo escuro</figcaption>
<img src="/_blob/d79db9f32424fb2fa7ca3568bccb68b6" alt="Informat, assinatura horizontal para fundo escuro" style="align-self: center; display: block; height: 52px; width: auto;">
<p style="margin: 0; font-family: var(--font-mono); font-size: 12px; line-height: 16px; color: var(--ink-2);">informat-horizontal-escuro.svg</p>
</figure>

<figure style="margin: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;">
<figcaption class="inf-label">Assinatura vertical</figcaption>
<img src="/_blob/6822301e95cc2efe4bb3b93bb916e9b9" alt="Informat, assinatura vertical" style="align-self: center; display: block; height: 150px; width: auto;">
<p style="margin: 0; font-family: var(--font-mono); font-size: 12px; line-height: 16px; color: var(--ink-2);">informat-vertical.svg</p>
</figure>

<figure style="margin: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;">
<figcaption class="inf-label">Símbolo, favicon e ícone de app</figcaption>
<div style="display: flex; align-items: flex-end; justify-content: space-around; gap: 24px;">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px;"><img src="/_blob/db582ae88bbd7b69c6522433f27e9c9f" alt="Informat, símbolo" style="display: block; width: 96px; height: 96px;"><span style="font-family: var(--font-mono); font-size: 12px; color: var(--ink-2);">48 · 96 px</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px;"><img src="/_blob/d75e5c4d0a4c5c01bc5fcefde23e610c" alt="Informat, ícone de app" style="display: block; width: 112px; height: 112px; border-radius: 24px;"><span style="font-family: var(--font-mono); font-size: 12px; color: var(--ink-2);">app 512</span></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
<div style="display: flex; align-items: flex-end; gap: 12px;"><img src="/_blob/f3934a5a672d662b113a9ec013e8bd8c" alt="Informat, favicon em 32 px" style="display: block; width: 32px; height: 32px;"><img src="/_blob/f3934a5a672d662b113a9ec013e8bd8c" alt="Informat, favicon em 16 px" style="display: block; width: 16px; height: 16px;"></div>
<span style="font-family: var(--font-mono); font-size: 12px; color: var(--ink-2);">favicon 32 · 16</span></div>
</div>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-2);">Abaixo de 24 px use o favicon: sem bandeira e com via sólida.</p>
</figure>

<figure style="margin: 0; display: grid; grid-template-rows: auto 1fr 1fr; gap: 12px; padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;">
<figcaption class="inf-label">Uma tinta</figcaption>
<div style="display: flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--base);"><img src="/_blob/3c62f9dd30a7210d43b9e9a9aefef8d2" alt="Informat, monocromático em tinta" style="display: block; height: 40px; width: auto;"></div>
<div style="display: flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--mascara);"><img src="/_blob/449c2c1d21ad49334382f6e448d5a870" alt="Informat, monocromático em branco" style="display: block; height: 40px; width: auto;"></div>
</figure>

<figure style="margin: 0; display: flex; flex-direction: column; gap: 16px; padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;">
<figcaption class="inf-label">Tamanho mínimo e usos inadequados</figcaption>
<div style="display: flex; align-items: flex-end; gap: 24px;">
<div style="display: flex; flex-direction: column; gap: 6px;"><img src="/_blob/a82fa723e25252ff2c4924dc43513bcd" alt="Informat em 96 px de largura" style="display: block; width: 96px; height: auto;"><span style="font-family: var(--font-mono); font-size: 12px; color: var(--ink-2);">96 px · 24 mm</span></div>
<div style="display: flex; flex-direction: column; gap: 6px;"><img src="/_blob/db582ae88bbd7b69c6522433f27e9c9f" alt="Símbolo em 16 px" style="display: block; width: 16px; height: 16px;"><span style="font-family: var(--font-mono); font-size: 12px; color: var(--ink-2);">16 px</span></div>
</div>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 20px;">
<li style="display: flex; gap: 8px; align-items: flex-start;"><span style="color: var(--err); flex: none;"><x-import component-from-global-scope="Informat.Icon" name="x-circle" size="{{n16}}"></x-import></span><span>Não escreva o nome em texto vivo nem troque a via por um pingo cheio.</span></li>
<li style="display: flex; gap: 8px; align-items: flex-start;"><span style="color: var(--err); flex: none;"><x-import component-from-global-scope="Informat.Icon" name="x-circle" size="{{n16}}"></x-import></span><span>Não recolora, não gire, sem sombra, contorno ou gradiente.</span></li>
<li style="display: flex; gap: 8px; align-items: flex-start;"><span style="color: var(--err); flex: none;"><x-import component-from-global-scope="Informat.Icon" name="x-circle" size="{{n16}}"></x-import></span><span>Não junte com o logotipo da RBX: a relação é "um produto RBX", em texto.</span></li>
</ul>
</figure>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
renderVals() {
  return { n16: 16 };
}
}
</script>
</body>
</html>
