<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>EmptyState · prévia</title>
<style>
  body { margin: 0; background: var(--base); color: var(--ink); font-family: var(--font-sans); }
  .pv { box-sizing: border-box; padding: var(--space-6); display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: flex-start; }
  .pv-col { box-sizing: border-box; padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-6); max-width: 640px; }
  .pv-grid { box-sizing: border-box; padding: var(--space-6); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--card-min)), 1fr)); gap: var(--space-4); }
  .pv-split { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
  .pv-split > [data-theme] { background: var(--base); color: var(--ink); }
  .pv-cap { margin: 0 0 var(--space-2); font-family: var(--font-mono); font-size: var(--fs-label); line-height: var(--lh-label); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--ink-2); flex-basis: 100%; }
</style>
</head>
<body>
<div id="root" class="pv-col"></div>
<script>
  var I = window.Informat, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(I.EmptyState, {
    title: 'Nenhuma OS aberta ainda', action: h(I.Button, { variant: 'primary', iconRight: 'arrow-right' }, 'Solicitar atendimento') },
    h('p', null, 'Quando você solicitar um atendimento, a ordem de serviço aparece aqui com cada etapa e cada mensagem.')));
</script>
</body>
</html>
