<!-- @dsCard group="Ordem de serviço" height=760 subtitle="As cinco etapas: trilha de cobre e vias" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>ServiceTimeline · prévia</title>
<style>
  body { margin: 0; background: var(--base); color: var(--ink); font-family: var(--font-sans); }
  .pv { box-sizing: border-box; padding: var(--space-6); display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: flex-start; }
  .pv-col { box-sizing: border-box; padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-6); max-width: 640px; }
  .pv-grid { box-sizing: border-box; padding: var(--space-6); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--card-min)), 1fr)); gap: var(--space-4); }
  .pv-split { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
  .pv-split > [data-theme] { background: var(--base); color: var(--ink); }
  .pv-cap { margin: 0 0 var(--space-2); font-family: var(--font-mono); font-size: var(--fs-label); line-height: var(--lh-label); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--ink-2); flex-basis: 100%; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var I = window.Informat, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', { className: 'pv-col' }, h('p', { className: 'pv-cap' }, 'Vertical, etapa atual: Orçamento aprovado'),
      h(I.ServiceTimeline, { stages: [
        { title: 'Solicitação', description: 'Recebemos a descrição e duas fotos.', time: '[DATA] · [HORA]', state: 'done' },
        { title: 'Diagnóstico', description: 'Disco com setores defeituosos; memória e temperatura normais.', time: '[DATA] · [HORA]', state: 'done' },
        { title: 'Orçamento aprovado', description: 'Esperando a sua aprovação do escopo e do backup.', time: 'Desde [DATA]', state: 'current' },
        { title: 'Execução', description: 'Troca do disco e reinstalação do sistema.', state: 'pending' },
        { title: 'Entrega e pós-atendimento', description: 'Testes de entrega, relatório e garantia de [PRAZO].', state: 'pending' } ] })),
    h('div', { className: 'pv-col', style: { maxWidth: 'none', paddingTop: 0 } }, h('p', { className: 'pv-cap' }, 'Horizontal'),
      h(I.ServiceTimeline, { current: 1, orientation: 'horizontal', hideDescriptions: true })),
    h('div', { className: 'pv-col', style: { maxWidth: 'none', paddingTop: 0 } }, h('p', { className: 'pv-cap' }, 'Modo explain, horizontal (Como funciona)'),
      h(I.ServiceTimeline, { mode: 'explain', orientation: 'horizontal' }))));
</script>
</body>
</html>
