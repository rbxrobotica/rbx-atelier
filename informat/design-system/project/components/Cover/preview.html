<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Informat</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--base); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 496px; height: 288px; }
  .mask { fill: var(--mascara); }
  .copper { fill: var(--cobre); }
  .deep { fill: var(--ink); }
  .chip { fill: var(--field); }
  .blk { rx: var(--radius-l); }
  .pad { rx: var(--radius-s); }
  .trace { fill: none; stroke: var(--cobre-via); stroke-width: 3; stroke-linejoin: miter; }
  .via { fill: var(--mascara); stroke: var(--cobre-via); stroke-width: 4; }
  .hole { fill: none; stroke: var(--base); stroke-width: 4; }
  .words { position: absolute; left: var(--space-12); bottom: var(--space-12); max-width: 440px; }
  .name { margin: 0; font-size: 88px; line-height: .92; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
  .tag { margin: var(--space-3) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 496 288" width="496" height="288">
<!--
  blocks      mascara 200x252 bled off the top (the placa: the identity, the largest) · cobre 88x104 · ink 176 wide bleeding off the right edge · field 40x32 once (a bare pad); bottoms on one line at space-12 from the edge; about 40% of 960x288
  arrangement one tall placa slab with satellites, gutters space-4, like parts on a board
  pattern     the literal motif of the README (trilhas com vias): a bus of 3 traces at a space-4 pitch with one mitered 45 degree jog, ending in 3 staggered vias, in cobre-via on the slab; two mounting holes cut from the ink block in base
  scales      sides in space-2 multiples; gutters space-4; trace pitch space-4; corners radius-l on blocks, radius-s on the pad; via ring = the via of the logo
-->
<rect class="mask blk" x="0" y="-12" width="200" height="252" rx="12"/>
<rect class="chip pad" x="216" y="88" width="40" height="32" rx="4"/>
<rect class="copper blk" x="216" y="136" width="88" height="104" rx="12"/>
<rect class="deep blk" x="320" y="40" width="200" height="200" rx="12"/>
<polyline class="trace" points="40,-12 40,94.63 88,142.63 88,176"/>
<polyline class="trace" points="56,-12 56,88 104,136 104,200"/>
<polyline class="trace" points="72,-12 72,81.37 120,129.37 120,224"/>
<circle class="via" cx="88" cy="176" r="5"/>
<circle class="via" cx="104" cy="200" r="5"/>
<circle class="via" cx="120" cy="224" r="5"/>
<circle class="hole" cx="344" cy="64" r="6"/>
<circle class="hole" cx="368" cy="64" r="6"/>
</svg>
</div>
<div class="words">
<h1 class="name">Informat</h1>
<p class="tag">A ordem de serviço como sistema: diagnóstico, escopo e dados à vista.</p>
</div>
</div>
</body>
</html>
