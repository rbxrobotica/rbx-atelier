<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>GPH Vitrine Néon</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 560px; height: 288px; }
  .magenta { fill: var(--magenta); }
  .pink { fill: var(--pink-fill); }
  .cyan { fill: var(--cyan); }
  .lilac { fill: var(--lilac); }
  .bar { fill: var(--bar); }
  .tube { stroke: var(--cyan); stroke-width: 2; fill: none; }
  .sign { rx: var(--radius-m); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-size: 120px; line-height: .92; font-weight: 700; font-style: italic; letter-spacing: -0.01em; color: var(--magenta); text-shadow: var(--text-glow-white); }
  .tagline { margin: var(--space-2) 0 0 6px; font-size: 14px; line-height: 20px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 560 288" width="560" height="288">
<!--
  blocks      magenta 144x192 (the sign, largest) · pink-fill 96x128 · cyan 64x64 · lilac 48x96 · bar 176x288 bleeding off the right edge as the night behind the signs; about 35% of 960x288
  arrangement a street of signs: unequal slabs hung at different heights from a common top line (y 32), gutters of space-5, the last block the deep night bleeding off the right
  pattern     a literal motif, the neon tube (the README's "letreiro"): four horizontal cyan rules of 2px running between and across the slabs at a space-5 pitch, cut by the slabs; nothing else
  scales      sides in space-2 multiples; gutters space-5 (24); tube pitch space-5 (24); slabs radius-m (6) like the buttons
-->
<rect class="bar" x="384" y="0" width="176" height="288"/>
<line class="tube" x1="0" y1="96" x2="560" y2="96"/>
<line class="tube" x1="0" y1="120" x2="560" y2="120"/>
<line class="tube" x1="0" y1="144" x2="560" y2="144"/>
<line class="tube" x1="0" y1="168" x2="560" y2="168"/>
<rect class="magenta sign" x="24" y="32" width="144" height="192" rx="6"/>
<rect class="pink sign" x="192" y="32" width="96" height="128" rx="6"/>
<rect class="cyan sign" x="312" y="32" width="64" height="64" rx="6"/>
<rect class="lilac sign" x="312" y="120" width="48" height="96" rx="6"/>
<rect class="pink sign" x="408" y="64" width="80" height="112" rx="6"/>
</svg>
</div>
<div class="words">
<h1 class="name">GPH</h1>
<p class="tagline">Galeria Premium Hoje · a vitrine que fica acesa.</p>
</div>
</div>
</body>
</html>
