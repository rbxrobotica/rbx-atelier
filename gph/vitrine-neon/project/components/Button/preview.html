<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div id="root"></div>
<script>
  var G = window.GphNeon, h = React.createElement;
  ReactDOM.createRoot(document.getElementById("root")).render(
    h('div', { className: 'gn-stack' },
      h('div', { className: 'gn-row', style: { padding: 0 } },
        h(G.Button, { variant: 'primary' }, 'Publique seu Anúncio'),
        h(G.Button, { variant: 'primary', size: 'l' }, 'Pesquisar'),
        h(G.Button, null, 'Salvar rascunho'),
        h(G.Button, { variant: 'quiet' }, 'Compartilhar')),
      h('div', { className: 'gn-row', style: { padding: 0 } },
        h(G.Button, { variant: 'primary', loading: true }, 'Enviando'),
        h(G.Button, { disabled: true }, 'Indisponível'),
        h(G.Button, { href: '#' }, 'Ver telefone'))));
</script>
</body>
</html>
