<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Toast</title></head>
<body>
<div id="root"></div>
<script>
  var G = window.Gph, h = React.createElement;
  ReactDOM.createRoot(document.getElementById("root")).render(h('div', { className: 'gph-row' }, h(G.Toast, { onClose: function () {} }, 'Mensagem enviada para quem anuncia.'), h(G.Toast, { tone: 'info', action: h('a', { href: '#' }, 'Ver') }, 'Rascunho salvo.')));
</script>
</body>
</html>
