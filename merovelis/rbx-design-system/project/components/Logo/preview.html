<!-- @dsCard group="Marca" height=380 width=1280 subtitle="Lockup empilhado, horizontal, fundo claro e só a marca" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Logo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Archivo:wdth,wght@125,700&display=swap">
<style>
body{margin:0;background:var(--bg-0);color:var(--fg-0);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
.wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s-6);padding:var(--s-6);box-sizing:border-box;width:1280px}
.cell{display:flex;flex-direction:column;gap:var(--s-5);padding:var(--s-5);border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-1);min-height:290px;box-sizing:border-box}
.cell.light{background:#ffffff;border-color:#dcdcdc;color:#1c1c1c}
.label{text-transform:uppercase;color:var(--fg-2)}
.light .label{color:#6b6b6b}
.big{display:flex;align-items:center;gap:var(--s-4);min-height:96px}
.small{display:flex;align-items:center;gap:var(--s-4);margin-top:auto;padding-top:var(--s-4);border-top:1px solid var(--border)}
.light .small{border-top-color:#dcdcdc}
.wm{font:700 40px/1 var(--font-wordmark);font-stretch:125%;letter-spacing:-0.02em;color:var(--fg-0)}
.wm.s{font-size:17px}
.light .wm{color:#1c1c1c}
.stack{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.stack.s{gap:3px}
.sys{text-transform:uppercase;letter-spacing:0.2em;color:var(--fg-2);font-size:14px}
.sys.s{font-size:9px}
.light .sys{color:#6b6b6b}
.sans{font:300 40px/1 var(--font-sans);letter-spacing:-0.01em;color:var(--fg-1)}
.sans.s{font-size:17px}
.brand{fill:var(--cyan-brand)}
.light .brand{fill:#0f8f8f}
.tile{display:flex;align-items:center;justify-content:center;border-radius:var(--radius-lg)}
</style>
</head>
<body>
<div class="wrap">

  <div class="cell">
    <span class="eyebrow label">Empilhado · padrão</span>
    <div class="big">
      <svg viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Marca RBX, bloco com dois chanfros"><path class="brand" d="M30 8 H56 V34 L34 56 H8 V30 Z"/></svg>
      <span class="stack"><span class="wm">RBX</span><span class="eyebrow sys">Systems</span></span>
    </div>
    <div class="small">
      <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><path class="brand" d="M30 8 H56 V34 L34 56 H8 V30 Z"/></svg>
      <span class="stack s"><span class="wm s">RBX</span><span class="eyebrow sys s">Systems</span></span>
      <span style="width:16px"></span>
      <svg viewBox="0 0 64 64" width="24" height="24" aria-hidden="true"><path class="brand" d="M30 8 H56 V34 L34 56 H8 V30 Z"/></svg>
      <span class="wm s" style="font-size:16px">RBX</span>
    </div>
  </div>

  <div class="cell">
    <span class="eyebrow label">Horizontal · rodapé e documentos</span>
    <div class="big">
      <svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><path class="brand" d="M30 8 H56 V34 L34 56 H8 V30 Z"/></svg>
      <span class="wm">RBX</span><span class="sans">Systems</span>
    </div>
    <div class="small">
      <svg viewBox="0 0 64 64" width="24" height="24" aria-hidden="true"><path class="brand" d="M30 8 H56 V34 L34 56 H8 V30 Z"/></svg>
      <span class="wm s">RBX</span><span class="sans s">Systems</span>
    </div>
  </div>

  <div class="cell light">
    <span class="eyebrow label">Fundo claro</span>
    <div class="big">
      <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><path class="brand" d="M30 8 H56 V34 L34 56 H8 V30 Z"/></svg>
      <span class="stack"><span class="wm">RBX</span><span class="eyebrow sys">Systems</span></span>
    </div>
    <div class="small">
      <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><path class="brand" d="M30 8 H56 V34 L34 56 H8 V30 Z"/></svg>
      <span class="stack s"><span class="wm s">RBX</span><span class="eyebrow sys s">Systems</span></span>
      <span style="width:16px"></span>
      <svg viewBox="0 0 64 64" width="24" height="24" aria-hidden="true"><path d="M30 8 H56 V34 L34 56 H8 V30 Z" fill="#1c1c1c"/></svg>
      <span class="wm s" style="font-size:16px">RBX</span>
    </div>
  </div>

  <div class="cell">
    <span class="eyebrow label">Só a marca · favicon e app</span>
    <div class="big" style="gap:var(--s-5)">
      <span class="tile" style="width:64px;height:64px;background:var(--cyan-brand)"><svg viewBox="0 0 64 64" width="44" height="44" aria-hidden="true"><path d="M30 8 H56 V34 L34 56 H8 V30 Z" style="fill:var(--on-cta)"/></svg></span>
      <span class="tile" style="width:64px;height:64px;background:var(--bg-0);border:1px solid var(--border)"><svg viewBox="0 0 64 64" width="44" height="44" aria-hidden="true"><path class="brand" d="M30 8 H56 V34 L34 56 H8 V30 Z"/></svg></span>
    </div>
    <div class="small" style="gap:var(--s-5)">
      <svg viewBox="0 0 64 64" width="32" height="32" aria-hidden="true"><path class="brand" d="M30 8 H56 V34 L34 56 H8 V30 Z"/></svg>
      <svg viewBox="0 0 64 64" width="24" height="24" aria-hidden="true"><path class="brand" d="M30 8 H56 V34 L34 56 H8 V30 Z"/></svg>
      <svg viewBox="0 0 64 64" width="16" height="16" aria-hidden="true"><path class="brand" d="M30 8 H56 V34 L34 56 H8 V30 Z"/></svg>
      <svg viewBox="0 0 64 64" width="12" height="12" aria-hidden="true"><path class="brand" d="M30 8 H56 V34 L34 56 H8 V30 Z"/></svg>
      <span class="caption" style="color:var(--fg-2);margin-left:auto">32 · 24 · 16 · 12</span>
    </div>
  </div>

</div>
</body>
</html>
