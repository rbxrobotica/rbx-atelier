<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Breadcrumb</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:var(--bg-0);color:var(--fg-0);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
.wrap{display:flex;flex-direction:column;gap:var(--s-5);padding:var(--s-5)}
.bc{text-transform:uppercase;color:var(--fg-2)}
.bc ol{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap}
.bc a{color:var(--fg-2);text-decoration:none;display:inline-flex;align-items:center}
.bc a:hover{color:var(--fg-0)}
.bc a:focus-visible{outline:none;box-shadow:var(--ring-focus);border-radius:var(--radius-sm)}
.bc .sep{color:var(--fg-3)}
.bc [aria-current]{color:var(--fg-0);padding-bottom:2px;box-shadow:inset 0 -1px 0 var(--cyan-dim)}
.bc svg{display:block}
</style>
</head>
<body>
<div class="wrap">
  <nav class="bc breadcrumb" aria-label="Caminho">
    <ol>
      <li><a href="#" aria-label="Início"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg></a></li>
      <li class="sep" aria-hidden="true">›</li>
      <li><a href="#">Produtos</a></li>
      <li class="sep" aria-hidden="true">›</li>
      <li><span aria-current="page">Robson</span></li>
    </ol>
  </nav>
  <nav class="bc breadcrumb" aria-label="Caminho, versão mobile">
    <ol>
      <li><a href="#" aria-label="Níveis anteriores">…</a></li>
      <li class="sep" aria-hidden="true">›</li>
      <li><a href="#">Journal</a></li>
      <li class="sep" aria-hidden="true">›</li>
      <li><span aria-current="page">Tag: Robson</span></li>
    </ol>
  </nav>
</div>
</body>
</html>
