      <span style="font: 300 20px/1 'Inter', system-ui, sans-serif; color: #b8bcc2;">Systems</span>
    </div>
    <div style="height: 96px; background: #ffffff; border: 1px solid #dcdcdc; border-radius: 4px; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><defs><mask id="a3"><rect width="64" height="64" fill="#fff"></rect><g transform="rotate(-45 32 32)"><rect x="-8" y="21" width="80" height="5" fill="#000"></rect><rect x="-8" y="38" width="80" height="5" fill="#000"></rect></g></mask></defs><circle cx="32" cy="32" r="28" fill="#0f8f8f" mask="url(#a3)"></circle></svg>

      <span style="font: 300 20px/1 'Inter', system-ui, sans-serif; color: #4e4e4e;">Systems</span>
    </div>
    <div style="height: 96px; background: #0d0f12; border: 1px solid #24282e; border-radius: 4px; display: flex; align-items: center; justify-content: center; gap: 16px;">
      <span style="width: 48px; height: 48px; background: #07080a; border: 1px solid #24282e; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
