# The security checks of the RBX engineering guardrails (section 2): secret
# scan, dependency exploit scan, security lint.
#
# Everything this workflow runs is pinned: the actions to the commit behind
# the release named beside them, the downloaded scanners to a release and its
# SHA-256, Node (and the npm it ships) to an exact version, the npm packages
# to .github/guardrails/package-lock.json.
#
# These checks are an aid to review, not a replacement for it. A pull request
# can change this workflow, the tools beside it and their exceptions (an
# eslint-disable comment, an osv-scanner.toml entry, a gitleaks allowlist),
# and code that runs can run other code. All of that is in the diff for a
# reviewer to read; the checks are for what a reviewer does not see at a
# glance.
name: Guardrails

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # gitleaks reads the output of `git log -p -U0`. Left to itself, that
      # output lacks four kinds of change, so the scans below pass their own
      # options to `git log`:
      # - A merge commit, for which git prints no patch unless asked.
      #   --diff-merges=first-parent prints every line a merge has and its
      #   first parent lacks.
      # - A file whose type changes, such as a symbolic link that becomes a
      #   regular file. gitleaks adds a filter that drops it, and adds none
      #   when the scan passes options of its own.
      # - A file git takes for binary, by its content or because a line of
      #   .gitattributes says so (-diff, binary). --text prints it as text.
      # - The lines a rename leaves as they were, which matters when a file
      #   leaves a path the gitleaks rules skip by name. --no-renames prints
      #   the file whole at its new path.
      LOG_OPTS: --text --no-renames --diff-merges=first-parent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download gitleaks 8.30.1
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # A throwaway repository with four random tokens, one in each kind of
      # change listed above: in a file that takes the place of a symbolic
      # link, typed into a merge commit, in a file that .gitattributes marks
      # -diff, and in a file renamed out of a path the rules skip. The scan,
      # with the options of the full-history scan below, has to find all four.
      - name: Check that the scan reads what gitleaks leaves out by default
        run: |
          fixture="$RUNNER_TEMP/scan-fixture"
          token() { printf 'token = "ghp_%s"\n' "$(od -An -tx1 -N18 /dev/urandom | tr -d ' \n')"; }
          git init --quiet --initial-branch=main "$fixture"
          git -C "$fixture" config user.name fixture
          git -C "$fixture" config user.email fixture@example.invalid
          ln -s nowhere "$fixture/was-a-link.env"
          git -C "$fixture" add was-a-link.env
          git -C "$fixture" commit --quiet --message 'a symbolic link'
          rm "$fixture/was-a-link.env"
          token > "$fixture/was-a-link.env"
          git -C "$fixture" commit --quiet --all --message 'the link becomes a file'
          git -C "$fixture" switch --quiet --create side
          git -C "$fixture" commit --quiet --allow-empty --message side
          git -C "$fixture" switch --quiet main
          git -C "$fixture" merge --quiet --no-ff --no-commit side
          token > "$fixture/typed-into-the-merge.env"
          git -C "$fixture" add typed-into-the-merge.env
          git -C "$fixture" commit --quiet --message merge
          printf 'marked-as-binary.env -diff\n' > "$fixture/.gitattributes"
          token > "$fixture/marked-as-binary.env"
          token > "$fixture/pnpm-lock.yaml"
          git -C "$fixture" add .gitattributes marked-as-binary.env pnpm-lock.yaml
          git -C "$fixture" commit --quiet --message 'a file marked -diff, a file at a path the rules skip'
          git -C "$fixture" mv pnpm-lock.yaml left-a-skipped-path.env
          git -C "$fixture" commit --quiet --message 'the file leaves the skipped path'
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="--full-history --all $LOG_OPTS" --report-path "$RUNNER_TEMP/scan-fixture.json" "$fixture" || true
          for file in was-a-link.env typed-into-the-merge.env marked-as-binary.env left-a-skipped-path.env; do
            if ! grep -q "$file" "$RUNNER_TEMP/scan-fixture.json"; then
              echo "gitleaks did not report the token in $file" >&2
              exit 1
            fi
          done
      # gitleaks reports nothing and exits 0 when the `git log` it runs fails
      # (a commit or an option git does not know, a patch git cannot print),
      # and also when that `git log` succeeds but writes a warning gitleaks
      # does not expect: a line of .gitattributes that git cannot read is
      # enough. So each scan first runs the command gitleaks runs, `git log -p
      # -U0` with the same options, and stops if it fails or writes anything
      # to standard error.
      # A pull request is scanned over its own commits, a push to main over the
      # full history of every branch and tag.
      - name: Scan the commits of the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          read -r -a options <<< "$LOG_OPTS ${BASE_SHA}..${HEAD_SHA}"
          if ! warnings="$(git log -p -U0 "${options[@]}" 2>&1 > /dev/null)" || [ -n "$warnings" ]; then
            printf '%s\n' "$warnings" >&2
            echo "git log failed or wrote the lines above, and gitleaks reports nothing when it does" >&2
            exit 1
          fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="${options[*]}" .
      - name: Scan the full history
        if: github.event_name == 'push'
        run: |
          read -r -a options <<< "--full-history --all $LOG_OPTS"
          if ! warnings="$(git log -p -U0 "${options[@]}" 2>&1 > /dev/null)" || [ -n "$warnings" ]; then
            printf '%s\n' "$warnings" >&2
            echo "git log failed or wrote the lines above, and gitleaks reports nothing when it does" >&2
            exit 1
          fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="${options[*]}" .

  dependency-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Download osv-scanner 2.7.0
        env:
          VERSION: 2.7.0
          SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${VERSION}/osv-scanner_linux_amd64"
          echo "${SHA256}  ${RUNNER_TEMP}/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"
      # The two pnpm projects by name, so a lockfile that goes missing fails
      # the step, and every other lockfile the walk finds, which today is the
      # one of the tools in .github/guardrails/.
      - name: Scan the lockfiles
        run: |
          "$RUNNER_TEMP/osv-scanner" scan source \
            --lockfile design-systems/rbx-systems/marketing-creatives/pnpm-lock.yaml \
            --lockfile design-systems/satwake/creative-review/pnpm-lock.yaml \
            --recursive .
      # The UI kit pages load React, ReactDOM and Babel standalone from unpkg,
      # and no lockfile names them. cdn-scripts.mjs reads the versions the
      # pages pin and writes them for the scan that follows. It fails on a
      # script from another origin that has no exact version or no integrity
      # check, on a script of the repository that the lint does not read, on
      # a symbolic link, and on a page that a browser could read differently
      # from this check and the lint.
      - name: Install the tools from their lockfile
        if: ${{ !cancelled() }}
        working-directory: .github/guardrails
        run: npm ci --ignore-scripts --no-audit --no-fund
      # osv-scanner reads lockfiles. A package.json with no lockfile, or with
      # a dependency its lockfile does not have, would be installed and never
      # scanned. pnpm and npm compare each lockfile with its package.json,
      # without installing anything and without running a script of the
      # project. The step then makes sure that the comparison fails on a
      # package.json that gained a dependency.
      - name: Check that every package.json has a lockfile that matches it
        if: ${{ !cancelled() }}
        run: |
          pnpm="$GITHUB_WORKSPACE/.github/guardrails/node_modules/.bin/pnpm"
          matches() {
            if [ -e "$1/pnpm-lock.yaml" ]; then
              # The last line keeps the files pnpm writes for itself out of the checkout.
              XDG_STATE_HOME="$RUNNER_TEMP/pnpm/state" "$pnpm" --dir "$1" install \
                --frozen-lockfile --lockfile-only --ignore-scripts --offline \
                --store-dir="$RUNNER_TEMP/pnpm/store" --cache-dir="$RUNNER_TEMP/pnpm/cache"
            elif [ -e "$1/package-lock.json" ]; then
              (cd "$1" && npm ci --dry-run --ignore-scripts --no-audit --no-fund)
            else
              echo "$1/package.json has no pnpm-lock.yaml or package-lock.json beside it" >&2
              return 1
            fi
          }
          git ls-files -- package.json '*/package.json' | while IFS= read -r manifest; do
            matches "$(dirname "$manifest")" < /dev/null
          done
          for project in design-systems/satwake/creative-review:pnpm-lock.yaml .github/guardrails:package-lock.json; do
            stale="$RUNNER_TEMP/stale/${project%%:*}"
            mkdir -p "$stale"
            cp "${project%%:*}/package.json" "${project%%:*}/${project##*:}" "$stale"
            (cd "$stale" && npm pkg set dependencies.left-pad=1.3.0)
            if matches "$stale" > /dev/null 2>&1; then
              echo "${project%%:*}: a package.json that gained a dependency passed with its old lockfile" >&2
              exit 1
            fi
          done
      - name: List the CDN scripts of the HTML pages
        if: ${{ !cancelled() }}
        run: node .github/guardrails/cdn-scripts.mjs "$RUNNER_TEMP/cdn-scripts/osv-scanner.json"
      - name: Scan the CDN script versions
        if: ${{ !cancelled() }}
        run: |
          if [ -s "$RUNNER_TEMP/cdn-scripts/osv-scanner.json" ]; then
            "$RUNNER_TEMP/osv-scanner" scan source --lockfile "osv-scanner:$RUNNER_TEMP/cdn-scripts/osv-scanner.json"
          else
            echo "No page pins a script from a CDN: nothing to scan."
          fi

  security-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Install the tools from their lockfile
        working-directory: .github/guardrails
        run: npm ci --ignore-scripts --no-audit --no-fund
      # One sample of each pattern the lint is there to catch, and the forms
      # an address of another origin can take, for the lint configuration and
      # for the CDN script check of the dependency-scan job.
      - name: Test the lint configuration and the CDN script check
        run: node --test .github/guardrails/eslint-config.test.mjs .github/guardrails/cdn-scripts.test.mjs
      # eslint.config.js carries the security rules as errors, for the .js,
      # .mjs, .cjs and .jsx files and for the inline scripts of the pages
      # named .html or .htm.
      - name: Run ESLint with the security rules
        if: ${{ !cancelled() }}
        run: .github/guardrails/node_modules/.bin/eslint --config .github/guardrails/eslint.config.js .
