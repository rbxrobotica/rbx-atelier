<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Capa</title>
<style>
  body { margin: 0; background: var(--fundo); color: var(--texto); font-family: var(--font-sans); }
  .capa { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .capa svg { position: absolute; inset: 0; display: block; }
  .b-marca { fill: var(--marca); }
  .b-forte { fill: var(--marca-forte); }
  .b-texto { fill: var(--texto); }
  .b-suave { fill: var(--marca-suave); rx: var(--radius-m); }
  .arco { fill: none; stroke: var(--marca-forte); stroke-width: var(--space-2); }
  .nome { position: absolute; left: var(--space-12); bottom: var(--space-12); width: 440px; }
  .nome h1 { margin: 0; font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: 90px; line-height: .95; letter-spacing: var(--ls-display); color: var(--texto); }
  .nome p { margin: var(--space-2) 0 0; font-size: 14px; line-height: 20px; color: var(--texto-2); }
</style>
</head>
<body>
<div class="capa">
  <!-- Derivação
       Blocos: marca 256×288 (x 480, sangra em cima e embaixo), marca-forte 224×160 e texto 224×128 empilhados à direita (x 736), marca-suave 96×96 de alívio no pé do bloco marca (raio radius-m).
       Arranjo: uma placa alta com dois satélites à direita, como a assinatura horizontal (símbolo + texto em duas linhas); os blocos ficam todos à direita de x = 480, o nome na base à esquerda.
       Padrão: arcos de sinal, a linha "motivo literal" do brief, porque o símbolo da Iteruno é o satélite com os arcos de sinal e o padrão da marca são quartos de círculo a partir do canto inferior esquerdo; 5 arcos em marca-forte sobre marca.
       Escalas: raio inicial space-12 (48), passo space-10 (40), traço space-2 (8); lados múltiplos de space-16 (64) e space-8 (32); canto do bloco de alívio radius-m. -->
  <svg width="960" height="288" viewBox="0 0 960 288" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect class="b-marca" x="480" y="0" width="256" height="288" />
    <rect class="b-forte" x="736" y="0" width="224" height="160" />
    <rect class="b-texto" x="736" y="160" width="224" height="128" />
    <path class="arco" d="M480 240 A48 48 0 0 1 528 288" />
    <path class="arco" d="M480 200 A88 88 0 0 1 568 288" />
    <path class="arco" d="M480 160 A128 128 0 0 1 608 288" />
    <path class="arco" d="M480 120 A168 168 0 0 1 648 288" />
    <path class="arco" d="M480 80 A208 208 0 0 1 688 288" />
    <rect class="b-suave" x="480" y="192" width="96" height="96" />
  </svg>
  <div class="nome">
    <h1>Iteruno</h1>
    <p>Tecnologia que funciona, explicada sem jargão.</p>
  </div>
</div>
</body>
</html>
