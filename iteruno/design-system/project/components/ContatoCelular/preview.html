<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ContatoCelular · prévia</title>
<style>
  body { margin: 0; background: var(--fundo); color: var(--texto); font-family: var(--font-sans); }
  .pv { box-sizing: border-box; padding: var(--space-6); display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: flex-start; }
  .pv-col { box-sizing: border-box; padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); }
  .pv-split { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
  .pv-stack { display: flex; flex-direction: column; }
  .pv-split > [data-theme], .pv-stack > [data-theme] { background: var(--fundo); color: var(--texto); min-width: 0; }
  .pv-cap { margin: 0; flex-basis: 100%; font-size: var(--fs-label); line-height: var(--lh-label); font-weight: var(--fw-semibold); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--texto-2); }
  .pv-icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: var(--space-2); }
  .pv-icon { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); padding: var(--space-2); border-radius: var(--radius-s); font-family: var(--font-mono); font-size: 11px; line-height: 14px; color: var(--texto-2); text-align: center; overflow-wrap: anywhere; }
  .pv-box { box-sizing: border-box; min-height: var(--control-l); padding: var(--space-3); border-radius: var(--radius-m); background: var(--marca-suave); color: var(--marca-forte); font-size: var(--fs-small); font-weight: var(--fw-semibold); display: grid; place-content: center; }
</style>
</head>
<body>
<div class="pv-stack"><div data-theme="claro" id="t-claro"></div></div>
<script>
  var I = window.Iteruno;
  function el(root, cls, html) { var d = document.createElement('div'); if (cls) d.className = cls; if (html) d.innerHTML = html; root.appendChild(d); return d; }
  function cap(root, t) { var p = document.createElement('p'); p.className = 'pv-cap'; p.textContent = t; root.appendChild(p); return p; }
  function m(C, target, props) { return I.mount(C, { target: target, props: props || {} }); }
  function demo(root, tema) {

    var r = el(root, 'pv-stack');
    m(I.NavBar, r, { current: '/contato', links: [{ label: 'Início', href: '/' }, { label: 'Serviços', href: '/servicos' }, { label: 'Cursos', href: '/cursos' }, { label: 'Sobre', href: '/sobre' }, { label: 'Contato', href: '/contato' }], cta: { label: 'Chamar no WhatsApp', href: '#', icon: 'whatsapp' } });
    m(I.Section, el(r, null), { eyebrow: 'Contato', title: 'Fale com a Iteruno', display: true, headingLevel: 1, lead: 'Conte o que aconteceu com o computador, o site ou o que você quer aprender. Respondemos em até um dia útil.', children: I.html('<div class="itr-grid itr-grid--2" style="align-items:start"><div id="pv-ct-form-' + tema + '"></div><div id="pv-ct-side-' + tema + '" style="display:flex;flex-direction:column;gap:var(--space-5)"></div></div>') });
    var ids = { a: 'ct-nome-' + tema, b: 'ct-email-' + tema, c: 'ct-tel-' + tema, d: 'ct-assunto-' + tema, e: 'ct-msg-' + tema, f: 'ct-lgpd-' + tema };
    m(I.Form, document.getElementById('pv-ct-form-' + tema), { children: I.html('<div class="itr-form__row itr-form__row--2"><div id="' + ids.a + '-w"></div><div id="' + ids.b + '-w"></div></div><div class="itr-form__row itr-form__row--2"><div id="' + ids.c + '-w"></div><div id="' + ids.d + '-w"></div></div><div id="' + ids.e + '-w"></div><div id="' + ids.f + '-w"></div><div class="itr-form__actions"><button type="submit" class="itr-btn itr-btn--primary itr-btn--l">Enviar mensagem</button></div><p class="itr-form__note">Ou, se preferir, chame direto no WhatsApp. Sem spam, sem cadastro.</p>') });
    m(I.TextField, document.getElementById(ids.a + '-w'), { id: ids.a, label: 'Nome', name: 'nome', required: true, placeholder: 'Como quer ser chamado' });
    m(I.TextField, document.getElementById(ids.b + '-w'), { id: ids.b, label: 'E-mail', name: 'email', type: 'email', required: true, placeholder: 'nome@exemplo.com.br' });
    m(I.TextField, document.getElementById(ids.c + '-w'), { id: ids.c, label: 'WhatsApp', name: 'tel', optional: true, type: 'tel', hint: 'Com DDD. Usamos só para retornar o contato.' });
    m(I.Select, document.getElementById(ids.d + '-w'), { id: ids.d, label: 'Assunto', name: 'assunto', placeholder: 'Escolha um assunto', options: [{ value: 'suporte', label: 'Suporte e manutenção' }, { value: 'site', label: 'Site' }, { value: 'curso', label: 'Cursos' }, { value: 'outro', label: 'Outro assunto' }] });
    m(I.TextField, document.getElementById(ids.e + '-w'), { id: ids.e, label: 'Mensagem', name: 'msg', multiline: true, rows: 5, maxlength: 1000, required: true, placeholder: 'O que aconteceu, desde quando e o que você já tentou.' });
    m(I.Checkbox, document.getElementById(ids.f + '-w'), { id: ids.f, label: 'Li e concordo com a Política de privacidade', description: 'Seus dados são usados só para responder a esta mensagem (LGPD).', required: true });
    var side = document.getElementById('pv-ct-side-' + tema);
    m(I.ContactCTA, side, { card: true, title: 'Prefere conversar agora?', text: 'Chame no WhatsApp. Em horário comercial a resposta costuma vir em minutos.', whatsapp: '[[CONFIRMAR 5511900000000]]', email: 'contact@rbxsystems.ch', meta: 'Segunda a sexta, 9h às 18h · [[CONFIRMAR horário]]', headingLevel: 2, symbol: false, pattern: false });
    m(I.Alert, side, { tone: 'info', title: 'Atendimento no local', text: 'Visitas em São Paulo com hora marcada. [[CONFIRMAR região atendida]]' });
    m(I.Footer, r, { promise: 'Tecnologia que funciona, explicada sem jargão.', columns: [{ title: 'Serviços', links: [{ label: 'Suporte & Manutenção', href: '#' }, { label: 'Sites', href: '#' }, { label: 'Cursos', href: '#' }] }, { title: 'Iteruno', links: [{ label: 'Sobre', href: '#' }, { label: 'Contato', href: '#' }, { label: 'Política de privacidade', href: '#' }] }], contact: { whatsapp: '[[CONFIRMAR (11) 9 0000-0000]]', whatsappHref: '#', email: 'contact@rbxsystems.ch', address: 'São Paulo, SP · [[CONFIRMAR bairro]]', hours: 'Seg. a sex., 9h às 18h' }, legal: 'CNPJ [[CONFIRMAR]]', year: 2026 });

  }
  demo(document.getElementById('t-claro'), 'claro');
</script>
</body>
</html>
